        async function selectQuality(q) {
            if (!q || state.selectedQuality === q) return;
            state.selectedQuality = q;
            state.requestedQuality = '';
            state.currentStreamUrl = '';
            closeAllPopovers();
            renderQualityMenu();
            await syncStreamSelection(true);
        }

        async function selectAudio(lang) {
            if (!lang) return;
            state.selectedAudio = lang;
            if (state.hls && Array.isArray(state.hls.audioTracks)) {
                const idx = state.hls.audioTracks.findIndex(t => t.lang === lang);
                if (idx >= 0) state.hls.audioTrack = idx;
            }
            closeAllPopovers();
            renderAudioMenu();
            if (state.manifest?.windowOnDemand) {
                state.requestedQuality = '';
                await syncStreamSelection(true);
            }
        }

        // ==========================================
        //  PLAYBACK DE VÍDEO & HLS
        // ==========================================
        function playStream(streamUrl, sourceLabel) {
            if (!streamUrl || state.currentStreamUrl === streamUrl) return;
            state.currentStreamUrl = streamUrl;

            if (state.hls) {
                try { state.hls.destroy(); } catch (e) {}
                state.hls = null;
            }

            dom.centralOverlay.style.display = 'none';

            const isM3u8 = /\.m3u8(?:[?#]|$)/i.test(streamUrl);
            if (isM3u8 && window.Hls && window.Hls.isSupported()) {
                const hls = new window.Hls({
                    maxBufferLength: 60,
                    maxMaxBufferLength: 120,
                    backBufferLength: 48
                });
                state.hls = hls;

                hls.on(window.Hls.Events.AUDIO_TRACKS_UPDATED, () => {
                    if (state.selectedAudio && Array.isArray(hls.audioTracks)) {
                        const idx = hls.audioTracks.findIndex(t => t.lang === state.selectedAudio);
                        if (idx >= 0) hls.audioTrack = idx;
                    }
                });

                hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
                    dom.video.play().catch(() => {});
                });

                hls.loadSource(streamUrl);
                hls.attachMedia(dom.video);
            } else {
                dom.video.src = streamUrl;
                dom.video.play().catch(() => {});
            }

            if (sourceLabel) {
                dom.badgeStatus.innerText = `● ${sourceLabel.toUpperCase()}`;
                dom.badgeStatus.className = 'badge-status mono';
            }

            if (state.selectedSubtitleTrackId && state.selectedSubtitleTrackId !== 'off' && state.playbackTicket && state.parsedSubtitleCues.length === 0 && !isFetchingSubtitle) {
                fetchSubtitleTrack(state.selectedSubtitleTrackId, false);
            }
        }

        function openLocalFile(input) {
            const file = input?.files?.[0];
            if (!file) return;
            state.isCustomMedia = true;
            const url = URL.createObjectURL(file);
            playStream(url, `Arquivo Local: ${file.name}`);
        }

        function promptDirectUrl() {
            const url = prompt('Cole a URL direta do vídeo (.mp4, .webm, .m3u8):');
            if (url && url.trim()) {
                state.isCustomMedia = true;
                playStream(url.trim(), 'Stream Direto');
            }
        }

        function stepEpisode(delta) {
            const nextEp = state.episode + delta;
            if (nextEp < 1) return;
            if (state.totalEpisodes > 0 && nextEp > state.totalEpisodes) {
                console.warn('[PlayerPro] Próximo episódio ultrapassa total de episódios catalogados:', nextEp, state.totalEpisodes);
                return;
            }
            window.parent.postMessage({
                type: 'anirium:player:step-episode',
                delta: delta,
                episode: nextEp,
                workId: state.workId
            }, '*');
        }

        // ==========================================
        //  SINCRONIZAÇÃO COM ANIRIUM SERVICE (4004)
        // ==========================================
        async function syncStreamSelection(forceRequest = false) {
            const m = state.manifest;
            if (!m || !state.playbackTicket) return;

            const qualities = Array.isArray(m.qualities) ? m.qualities : [];
            if (qualities.length > 0 && (!state.selectedQuality || !qualities.includes(state.selectedQuality))) {
                state.selectedQuality = qualities[0];
            }

            const audios = Array.isArray(m.audioChoices) && m.audioChoices.length > 0
                ? m.audioChoices
                : (Array.isArray(m.audios) ? m.audios : []);
            if (audios.length > 0 && (!state.selectedAudio || !audios.includes(state.selectedAudio))) {
                state.selectedAudio = audios.includes('jpn') ? 'jpn' : audios[0];
            }

            state.subtitleTracks = Array.isArray(m.subtitleTracks) ? m.subtitleTracks : [];
            const activeTrackExists = state.subtitleTracks.some(t => t.id === state.selectedSubtitleTrackId);
            // Só inicializa/busca legenda se ainda não tiver nenhuma legenda selecionada ou se não houver cues carregados
            if (state.selectedSubtitleTrackId !== 'off' && state.subtitleTracks.length > 0) {
                if (!state.selectedSubtitleTrackId || (!activeTrackExists && state.parsedSubtitleCues.length === 0 && !isFetchingSubtitle)) {
                    const ptTrack = state.subtitleTracks.find(t => /por|pt/i.test(t.language || ''));
                    state.selectedSubtitleTrackId = (ptTrack || state.subtitleTracks[0]).id;
                    fetchSubtitleTrack(state.selectedSubtitleTrackId, false);
                }
            }

            // Atualiza botões e popovers
            renderQualityMenu();
            renderAudioMenu();
            renderSubMenu();

            // Atualiza telemetria no player
            const links = Number(m.activeLinks ?? state.sourcesCount ?? 0);
            const peers = Number(m.peers ?? 0);
            const rate = m.downloadRate || '0 KB/s';
            dom.teleLinks.innerText = `⚡ ${links} Magnets`;
            dom.telePeers.innerText = `👥 ${peers} Peers`;
            dom.teleRate.innerText = `⬇ ${rate}`;

            if (!state.selectedQuality) return;

            // Se o vídeo já estiver ativo e reproduzindo sem erros, NÃO interrompe o playback
            // durante o polling do manifesto, a menos que o usuário tenha forçado a troca (ex: clicou em outra qualidade)
            if (!forceRequest && state.currentStreamUrl && dom.video && !dom.video.error) {
                return;
            }

            // Variante já pronta?
            const readyVariant = (Array.isArray(m.variants) ? m.variants : []).find(
                v => v.quality === state.selectedQuality && v.status === 'ready' && v.playlistUrl
            );
            if (readyVariant && readyVariant.playlistUrl) {
                const streamUrl = `http://127.0.0.1:4004${readyVariant.playlistUrl}?playbackTicket=${encodeURIComponent(state.playbackTicket)}`;
                playStream(streamUrl, `Anirium+ Unificado (${state.selectedQuality})`);
                return;
            }

            // Se o stream já estiver reproduzindo e não houver solicitação forçada (ex: troca manual de qualidade/áudio),
            // não dispara nova preparação de trecho para não reiniciar o buffer
            if (!forceRequest && state.currentStreamUrl) {
                return;
            }

            // Solicitação sob demanda
            const sig = `${state.selectedQuality}:${state.selectedAudio || ''}`;
            if (!forceRequest && state.requestedQuality === sig) return;
            state.requestedQuality = sig;

            dom.overlayStatus.innerText = `Unificando ${links} fonte(s) P2P em ${state.selectedQuality} (${peers} peers)...`;

            try {
                if (m.windowOnDemand) {
                    if (state.windowController) {
                        try { state.windowController.abort(); } catch (e) {}
                    }
                    const ctrl = new AbortController();
                    state.windowController = ctrl;
                    const pos = (!state.hasResumed && state.initialResumeTime > 2)
                        ? state.initialResumeTime
                        : ((dom.video && Number.isFinite(dom.video.currentTime) && dom.video.currentTime > 0) ? Math.floor(dom.video.currentTime) : 0);
                    if (!state.hasResumed && state.initialResumeTime > 2) {
                        state.hasResumed = true;
                        console.info('[PlayerPro] Solicitando primeiro trecho de vídeo já no tempo de retomada:', pos, 's');
                    }

                    const res = await fetch(`http://127.0.0.1:4004/playback/session?playbackTicket=${encodeURIComponent(state.playbackTicket)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal: ctrl.signal,
                        body: JSON.stringify({
                            action: 'seek',
                            quality: state.selectedQuality,
                            position: pos,
                            playing: true,
                            audio: state.selectedAudio || '',
                            subtitle: state.selectedSubtitleTrackId && state.selectedSubtitleTrackId !== 'off' ? state.selectedSubtitleTrackId : ''
                        })
                    });
                    if (res.ok) {
                        const data = await res.json().catch(() => ({}));
                        if (data.window && data.window.status === 'ready' && data.window.playlistUrl) {
                            state.currentWindow = data.window;
                            const streamUrl = `http://127.0.0.1:4004${data.window.playlistUrl}?playbackTicket=${encodeURIComponent(state.playbackTicket)}`;
                            playStream(streamUrl, `Anirium+ Unificado (${state.selectedQuality})`);
                        }
                    }
                } else if (m.qualityOnDemand) {
                    await fetch(`http://127.0.0.1:4004/playback/variant?quality=${encodeURIComponent(state.selectedQuality)}&playbackTicket=${encodeURIComponent(state.playbackTicket)}`, {
                        method: 'POST'
                    });
                }
            } catch (e) {}
        }

        async function initPlayer() {
            dom.badgeEp.innerText = `EPISÓDIO ${state.episode}${state.totalEpisodes > 0 ? ` / ${state.totalEpisodes}` : ''}`;
            dom.videoTitle.innerText = `${state.title} — Episódio ${state.episode}${state.totalEpisodes > 0 ? ` / ${state.totalEpisodes}` : ''}`;
            dom.overlayHeading.innerText = `${state.title} — Episódio ${state.episode}`;
            dom.btnPrevEp.style.display = state.episode > 1 ? 'inline-flex' : 'none';
            if (state.totalEpisodes > 0 && state.episode >= state.totalEpisodes) {
                dom.btnNextEp.style.display = 'none';
            } else {
                dom.btnNextEp.style.display = 'inline-flex';
            }

            // 1. Checa Service 4004
            let serviceOnline = false;
            try {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 1800);
                const hRes = await fetch('http://127.0.0.1:4004/health', { signal: ctrl.signal });
                clearTimeout(t);
                serviceOnline = hRes.ok;
            } catch (e) {
                serviceOnline = false;
            }

            if (!serviceOnline) {
                dom.badgeStatus.innerText = '● SERVICE 4004 OFFLINE';
                dom.badgeStatus.className = 'badge-status warn mono';
                dom.overlayStatus.innerHTML = 'O aplicativo <strong>Anirium Service (porta 4004)</strong> não foi detectado em execução no seu computador. Inicie o Anirium Service no Windows ou utilize um arquivo/link abaixo.';
                if (dom.overlayManualActions) dom.overlayManualActions.style.display = 'flex';
                return;
            }

            if (!state.token || !state.deviceId) {
                dom.badgeStatus.innerText = '● AGUARDANDO SESSÃO';
                dom.badgeStatus.className = 'badge-status warn mono';
                dom.overlayStatus.innerText = 'Aguardando autorização de sessão do Anirium...';
                if (dom.overlayManualActions) dom.overlayManualActions.style.display = 'flex';
                return;
            }

            if (dom.overlayManualActions) dom.overlayManualActions.style.display = 'none';
            dom.badgeStatus.innerText = '● AUTENTICADO NO SERVICE 4004';
            dom.overlayStatus.innerText = 'Sondando provedores P2P e preparando mixer de streaming...';

            // Preparação do Playback
            const preparePayload = {
                token: state.token,
                deviceId: state.deviceId,
                title: state.title,
                titleEnglish: state.titleEnglish || state.title,
                titleRomaji: state.titleRomaji || state.title,
                season: state.season || 1,
                episode: state.episode || 1,
                malId: state.malId || 0,
                format: state.format || 'TV',
                episodeCount: state.totalEpisodes || 0
            };

            try {
                const prepRes = await fetch('http://127.0.0.1:4004/playback/prepare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(preparePayload)
                });
                const prepData = await prepRes.json().catch(() => ({}));

                if (!prepRes.ok) {
                    dom.badgeStatus.innerText = `● ERRO (${prepData.reason || prepRes.status})`;
                    dom.badgeStatus.className = 'badge-status warn mono';
                    dom.overlayStatus.innerText = `O Anirium Service recusou a preparação (${prepData.reason || prepRes.status}).`;
                    return;
                }

                if (prepData.status === 'no-sources' && !prepData.playbackTicket) {
                    dom.badgeStatus.innerText = '● SEM FONTES NO SWARM';
                    dom.badgeStatus.className = 'badge-status warn mono';
                    dom.overlayStatus.innerHTML = `Nenhuma fonte P2P retornada pelos provedores para <strong>${state.title} — Episódio ${state.episode}</strong>.`;
                    return;
                }

                state.playbackTicket = prepData.playbackTicket || '';
                state.sourcesCount = Number(prepData.sources || 0);

                dom.badgeStatus.innerText = '● SWARM CONECTADO';
                dom.overlayStatus.innerText = 'Sessão unificada ativa! Sintonizando áudio, vídeo e legendas...';

                // Polling do Manifesto
                const poll = async () => {
                    if (!state.playbackTicket) return;
                    try {
                        const mRes = await fetch('http://127.0.0.1:4004/manifest', {
                            cache: 'no-store',
                            headers: {
                                'Authorization': `Bearer ${state.token}`,
                                'X-Anirium-Device': state.deviceId
                            }
                        });
                        if (!mRes.ok) return;
                        state.manifest = await mRes.json();
                        await syncStreamSelection(false);
                    } catch (e) {}
                };

                await poll();
                if (state.manifestTimer) clearInterval(state.manifestTimer);
                state.manifestTimer = setInterval(poll, 4000);

                // ==========================================
                //  RENOVAÇÃO CONTÍNUA DE SESSÃO / TOKEN
                // ==========================================
                const renewSession = async () => {
                    if (!state.playbackTicket || !state.deviceId) return;
                    try {
                        // Solicita ao parent (Core) uma renovação de token segura
                        window.parent.postMessage({
                            type: 'anirium:player:request-token-renewal',
                            deviceId: state.deviceId,
                            playerSessionId: state.playerSessionId
                        }, '*');

                        // Também tenta obter diretamente se estiver sob a mesma origem com o header obrigatório
                        const headers = {
                            'Accept': 'application/json',
                            'x-anirium-device': state.deviceId
                        };
                        if (state.playerSessionId) {
                            headers['x-anirium-player-session'] = state.playerSessionId;
                        }
                        const sRes = await fetch('/api/service/session', {
                            cache: 'no-store',
                            headers: headers
                        });
                        if (sRes.ok) {
                            const sData = await sRes.json().catch(() => ({}));
                            if (sData.token && typeof sData.token === 'string') {
                                state.token = sData.token;
                                // Notifica o anirium-service da renovação do lease
                                await fetch('http://127.0.0.1:4004/playback/renew', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        playbackTicket: state.playbackTicket,
                                        token: state.token,
                                        deviceId: state.deviceId
                                    })
                                }).catch(() => {});
                                console.info('[PlayerPro] Sessão e token renovados com sucesso');
                            }
                        }
                    } catch (e) {}
                };

                if (state.renewTimer) clearInterval(state.renewTimer);
                state.renewTimer = setInterval(renewSession, 120000); // A cada 2 minutos
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') void renewSession();
                });

                // ==========================================
                //  TELEMETRIA P2P, SEEDING & CONTRIBUIÇÃO DE REDE
                // ==========================================
                let lastRawBytesUploaded = 0;
                let lastRawBytesDownloaded = 0;
                const parseFormattedBytes = (str) => {
                    if (!str || typeof str !== 'string') return 0;
                    const parts = str.trim().split(/\s+/);
                    const val = parseFloat(parts[0]) || 0;
                    const unit = (parts[1] || 'MB').toUpperCase();
                    if (unit.startsWith('GB')) return Math.floor(val * 1024 * 1024 * 1024);
                    if (unit.startsWith('MB')) return Math.floor(val * 1024 * 1024);
                    if (unit.startsWith('KB')) return Math.floor(val * 1024);
                    return Math.floor(val);
                };

                const reportP2pNetworkActivity = async () => {
                    if (!state.token || !state.deviceId) return;
                    try {
                        const stRes = await fetch('http://127.0.0.1:4004/stats', {
                            cache: 'no-store',
                            headers: {
                                'Authorization': `Bearer ${state.token}`,
                                'X-Anirium-Device': state.deviceId
                            }
                        });
                        if (stRes.ok) {
                            const stData = await stRes.json().catch(() => ({}));
                            const currentUp = parseFormattedBytes(stData.totalUploaded);
                            const currentDown = parseFormattedBytes(stData.totalDownloaded);

                            let deltaUp = 0;
                            let deltaDown = 0;
                            if (lastRawBytesUploaded > 0 && currentUp >= lastRawBytesUploaded) {
                                deltaUp = currentUp - lastRawBytesUploaded;
                            }
                            if (lastRawBytesDownloaded > 0 && currentDown >= lastRawBytesDownloaded) {
                                deltaDown = currentDown - lastRawBytesDownloaded;
                            }
                            lastRawBytesUploaded = currentUp;
                            lastRawBytesDownloaded = currentDown;

                            // Emite para o Core (Lobby) contabilizar XP e métricas absolutas via heartbeat
                            window.parent.postMessage({
                                type: 'anirium:player:p2p-metrics',
                                payload: {
                                    delta_uploaded_bytes: deltaUp,
                                    delta_downloaded_bytes: deltaDown,
                                    upload_rate: stData.uploadRate || '0.0 KB/s',
                                    download_rate: stData.downloadRate || '0.0 KB/s',
                                    peers: Number(stData.peers || 0),
                                    is_playing: dom.video ? !dom.video.paused : false,
                                    current_time: dom.video ? dom.video.currentTime || 0 : 0
                                }
                            }, '*');
                        }
                    } catch (e) {}
                };

                // Reporta telemetria P2P a cada 30 segundos
                setInterval(reportP2pNetworkActivity, 30000);
                setTimeout(reportP2pNetworkActivity, 5000);

            } catch (e) {
                dom.badgeStatus.innerText = '● ERRO DE CONEXÃO 4004';
                dom.badgeStatus.className = 'badge-status warn mono';
                dom.overlayStatus.innerText = 'Falha ao comunicar com o Anirium Service local na porta 4004.';
            }
        }

        // Teclado (Atalhos Avançados do Player Pro)
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.isContentEditable) return;

            // Pula para porcentagem do vídeo (0 a 9)
            if (/^Digit[0-9]$/.test(e.code) || /^Numpad[0-9]$/.test(e.code)) {
                const digit = parseInt(e.key, 10);
                if (!isNaN(digit)) {
                    e.preventDefault();
                    const dur = (state.manifest?.episodeDuration && state.manifest.episodeDuration > 0)
                        ? state.manifest.episodeDuration
                        : (dom.video.duration || 0);
                    if (dur > 0) {
                        const target = (digit / 10) * dur;
                        seekTo(target);
                        showActionFeedback('center', `${digit * 10}%`);
                    }
                    return;
                }
            }

            switch (e.code) {
                case 'Space':
                case 'KeyK':
                    e.preventDefault();
                    togglePlay();
                    showActionFeedback('center', dom.video.paused ? '❚❚' : '▶');
                    break;
                case 'ArrowLeft':
                case 'KeyJ':
                    e.preventDefault();
                    seekRelative(-10);
                    showActionFeedback('left', '❮❮ 10s');
                    break;
                case 'ArrowRight':
                case 'KeyL':
                    e.preventDefault();
                    seekRelative(10);
                    showActionFeedback('right', '10s ❯❯');
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    dom.video.volume = Math.min(1, dom.video.volume + 0.05);
                    dom.video.muted = false;
                    updateVolumeUI();
                    showActionFeedback('center', `Vol: ${Math.round(dom.video.volume * 100)}%`);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    dom.video.volume = Math.max(0, dom.video.volume - 0.05);
                    updateVolumeUI();
                    showActionFeedback('center', `Vol: ${Math.round(dom.video.volume * 100)}%`);
                    break;
                case 'KeyF':
                    e.preventDefault();
                    toggleFullscreen();
                    break;
                case 'KeyM':
                    e.preventDefault();
                    toggleMute();
                    showActionFeedback('center', dom.video.muted ? 'Sem Áudio' : 'Áudio On');
                    break;
                case 'KeyC':
                    e.preventDefault();
                    toggleDropdown('card-sub');
                    break;
                case 'KeyN':
                    e.preventDefault();
                    stepEpisode(1);
                    break;
                case 'KeyP':
                    e.preventDefault();
                    stepEpisode(-1);
                    break;
            }
        });

        // Recebe credenciais e contexto do Core via postMessage
        window.addEventListener('message', (event) => {
            const msg = event.data;
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'anirium:core:init-player') {
                Object.assign(state, msg.payload || {});
                initPlayer();
            } else if (msg.type === 'anirium:core:token-renewed' && msg.token) {
                state.token = msg.token;
                console.info('[PlayerPro] Token renovado pelo Core');
            }
        });

        initPlayer();
    </script>
</body>
</html>
