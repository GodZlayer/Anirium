<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Anirium Player Pro — Reprodutor Soberano</title>
    <script src="./hls.min.js"></script>
    <style>
        :root {
            --bg: #07080C;
            --surface: #0E1118;
            --raised: #161B26;
            --border: rgba(255, 255, 255, 0.12);
            --border-hover: rgba(255, 199, 102, 0.45);
            --accent: #FFC766;
            --accent-glow: rgba(255, 199, 102, 0.25);
            --canon: #10B981;
            --text: #FFF9F0;
            --muted: #94A3B8;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            user-select: none;
            -webkit-user-select: none;
        }

        .mono {
            font-family: var(--font-mono);
        }

        /* Container Principal do Player */
        #player-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Camadas de Gradiente / Sombras */
        .gradient-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 96px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .gradient-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 130px;
            background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        /* Barra Superior Suspensa no Player */
        .player-header {
            position: absolute;
            top: 14px;
            left: 18px;
            right: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 25;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge-ep {
            background: var(--accent);
            color: #0B0B0D;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            text-shadow: none;
        }

        .badge-status {
            background: rgba(16, 185, 129, 0.15);
            color: #6EE7B7;
            border: 1px solid rgba(16, 185, 129, 0.35);
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            text-transform: uppercase;
        }

        .badge-status.warn {
            background: rgba(245, 158, 11, 0.15);
            color: #FCD34D;
            border-color: rgba(245, 158, 11, 0.35);
        }

        .badge-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            max-width: 48vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ep-step {
            background: rgba(22, 27, 38, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ep-step:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 199, 102, 0.15);
        }

        /* Overlay Central de Espera / Abertura de Arquivo */
        #central-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            gap: 14px;
            background: radial-gradient(circle at center, rgba(14, 17, 24, 0.95) 0%, rgba(7, 8, 12, 0.98) 100%);
            z-index: 30;
            transition: opacity 0.3s ease;
        }

        .spin-slow {
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .orb-pulse {
            width: 58px;
            height: 58px;
            border-radius: 20px;
            background: rgba(255, 199, 102, 0.15);
            border: 1px solid rgba(255, 199, 102, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--accent);
            box-shadow: 0 0 24px var(--accent-glow);
            animation: pulseSlow 2.5s infinite ease-in-out;
        }

        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #0B0B0D;
            border: none;
            box-shadow: 0 4px 14px rgba(255, 199, 102, 0.35);
        }

        .btn-primary:hover {
            transform: scale(1.03);
            filter: brightness(1.08);
        }

        .btn-secondary {
            background: rgba(22, 27, 38, 0.85);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(6px);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Overlay Flutuante de Legenda Sincronizada */
        #subtitle-overlay {
            position: absolute;
            bottom: 84px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 35;
            transition: bottom 0.25s ease, top 0.25s ease;
        }

        #subtitle-text {
            background: transparent;
            color: #FFFFFF;
            font-weight: 700;
            text-align: center;
            border-radius: 8px;
            padding: 4px 12px;
            max-width: 86vw;
            white-space: pre-line;
            line-height: 1.35;
            font-size: 19px;
            font-family: var(--font-sans);
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000, 0px 2px 0px #000, 0px -2px 0px #000, 2px 0px 0px #000, -2px 0px 0px #000, 0 3px 6px rgba(0,0,0,0.9);
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        /* Controles Inferiores Netflix-Style */
        .player-controls {
            position: absolute;
            bottom: 12px;
            left: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 25;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Barra de Progresso / Timeline */
        .timeline-container {
            position: relative;
            width: 100%;
            height: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .timeline-track {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            overflow: hidden;
            transition: height 0.15s ease;
        }

        .timeline-container:hover .timeline-track {
            height: 7px;
        }

        .timeline-buffer {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: rgba(255, 255, 255, 0.38);
            border-radius: 999px;
            transition: width 0.2s ease;
        }

        .timeline-progress {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, #FFC766 0%, #FFA826 100%);
            border-radius: 999px;
            box-shadow: 0 0 8px rgba(255, 199, 102, 0.8);
        }

        .timeline-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #FFC766;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.15s ease;
            pointer-events: none;
        }

        .timeline-container:hover .timeline-thumb {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Linha de Botões de Ação do Player */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: relative;
        }

        .ctrl-btn:hover {
            color: var(--accent);
            transform: scale(1.1);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .ctrl-btn.play-circle {
            background: var(--accent);
            color: #0B0B0D;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(255, 199, 102, 0.35);
        }

        .ctrl-btn.play-circle:hover {
            transform: scale(1.08);
            filter: brightness(1.1);
            color: #0B0B0D;
        }

        .time-display {
            font-size: 11px;
            color: #E2E8F0;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* Controle de Volume */
        .volume-group {
            position: relative;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .volume-slider {
            width: 0;
            opacity: 0;
            transition: width 0.2s ease, opacity 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 999px;
            cursor: pointer;
            outline: none;
        }

        .volume-group:hover .volume-slider {
            width: 65px;
            opacity: 1;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        /* Menus Flutuantes Elegantes (Qualidade, Áudio, Legenda) */
        .popover-menu {
            position: relative;
        }

        .popover-card {
            position: absolute;
            bottom: calc(100% + 12px);
            right: 0;
            background: rgba(14, 17, 24, 0.98);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px;
            min-width: 250px;
            max-width: 360px;
            max-height: 60vh;
            display: none;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
            z-index: 50;
            overflow: hidden;
        }

        .popover-card.open {
            display: flex;
        }

        .popover-scroll-area {
            overflow-y: auto;
            max-height: calc(60vh - 45px);
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-right: 4px;
        }

        .popover-scroll-area::-webkit-scrollbar {
            width: 4px;
        }

        .popover-scroll-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .popover-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(255, 199, 102, 0.4);
            border-radius: 4px;
        }

        .popover-header {
            padding: 6px 10px;
            font-size: 10px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .popover-group-title {
            padding: 6px 8px 3px 8px;
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .popover-group-title:first-child {
            border-top: none;
            margin-top: 0;
        }

        .popover-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            text-align: left;
            width: 100%;
        }

        .popover-item:hover {
            background: rgba(255, 199, 102, 0.15);
            color: var(--accent);
        }

        .popover-item.active {
            background: rgba(255, 199, 102, 0.2);
            color: var(--accent);
            font-weight: 800;
        }

        /* Configurações Customizadas de Legenda (Tamanho, Cor, Fundo) */
        .sub-config-box {
            padding: 8px;
            background: rgba(22, 27, 38, 0.85);
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .sub-config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-size: 10px;
            color: var(--muted);
        }

        .sub-config-btn-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sub-config-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.15s ease;
        }

        .sub-config-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .sub-config-btn.active {
            background: var(--accent);
            color: #07080C;
            border-color: var(--accent);
        }

        .sub-color-pill {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .sub-color-pill:hover {
            transform: scale(1.15);
        }

        .sub-color-pill.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent);
        }

        /* Barra de Telemetria Integrada no Player */
        .telemetry-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .tele-tag {
            background: rgba(22, 27, 38, 0.8);
            border: 1px solid var(--border);
            padding: 2px 7px;
            border-radius: 6px;
        }

        .tele-tag.online {
            border-color: rgba(16, 185, 129, 0.4);
            color: #6EE7B7;
        }

        /* Feedback Visual Central de Toque/Atalho (Seek, Play/Pause) */
        .action-feedback-ripple {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(22, 27, 38, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 13px;
            font-weight: 800;
            pointer-events: none;
            z-index: 40;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .action-feedback-ripple.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.08);
        }

        /* Auto-Hide de Controles */
        .hide-controls .player-header,
        .hide-controls .player-controls,
        .hide-controls .gradient-top,
        .hide-controls .gradient-bottom {
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
        }

        .hide-controls .player-header {
            transform: translateY(-6px);
        }

        .hide-controls #subtitle-overlay {
            bottom: 30px;
        }

        .hide-cursor {
            cursor: none;
        }
    </style>
</head>
<body>
    <div id="player-wrapper">
        <video id="video-element" playsinline crossorigin="anonymous"></video>

        <!-- Sombras de Contraste Superior e Inferior -->
        <div class="gradient-top"></div>
        <div class="gradient-bottom"></div>

        <!-- Barra Superior Integrada -->
        <header class="player-header">
            <div class="header-meta">
                <span id="badge-ep" class="badge-ep mono">EPISÓDIO 1</span>
                <span id="badge-status" class="badge-status mono">● CONECTANDO AO SERVICE 4004</span>
                <h2 id="video-title" class="badge-title">Anirium Player Pro</h2>
            </div>
            <div class="header-actions">
                <button type="button" id="btn-prev-ep" class="btn-ep-step mono" onclick="stepEpisode(-1)">❮ Ep. Anterior</button>
                <button type="button" id="btn-next-ep" class="btn-ep-step mono" onclick="stepEpisode(1)">Próximo Ep. ❯</button>
            </div>
        </header>

        <!-- Feedback Visual Central de Ações (Pause, Play, +-10s) -->
        <div id="feedback-left" class="action-feedback-ripple" style="left: 20%;">
            <span>❮❮</span>
            <span>-10s</span>
        </div>
        <div id="feedback-center" class="action-feedback-ripple" style="left: 50%;">
            <span id="feedback-center-icon">▶</span>
        </div>
        <div id="feedback-right" class="action-feedback-ripple" style="left: 80%;">
            <span>❯❯</span>
            <span>+10s</span>
        </div>

        <!-- Overlay Central de Inicialização / Arquivo Local -->
        <div id="central-overlay">
            <div class="orb-pulse">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="spin-slow">
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                    <path d="M12 2a10 10 0 0 1 10 10" stroke="#FFC766"></path>
                </svg>
            </div>
            <div style="max-width: 520px; display: flex; flex-direction: column; gap: 8px;">
                <h3 id="overlay-heading" style="font-size: 17px; font-weight: 800; color: #FFF9F0;">
                    Carregando Episódio...
                </h3>
                <p id="overlay-status" class="mono" style="font-size: 11px; color: var(--muted); line-height: 1.6;">
                    Inicializando mixer multi-magnet e autenticando sessão de vídeo local...
                </p>
            </div>
            <div id="overlay-manual-actions" style="display: none; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-top: 6px;">
                <label class="btn-action btn-primary mono">
                    📂 Abrir Arquivo Local (.mp4/.mkv)
                    <input type="file" accept="video/*,.mkv" style="display:none;" onchange="openLocalFile(this)">
                </label>
                <button type="button" class="btn-action btn-secondary mono" onclick="promptDirectUrl()">
                    🔗 Link Direto (.m3u8/.mp4)
                </button>
            </div>
        </div>

        <!-- Overlay Dinâmico de Legendas WebVTT -->
        <div id="subtitle-overlay" style="display: none;">
            <div id="subtitle-text"></div>
        </div>

        <!-- Painel Inferior de Controles Customizados -->
        <footer class="player-controls">
            <!-- Timeline / Progress Bar -->
            <div class="timeline-container" id="timeline-box">
                <div class="timeline-track">
                    <div class="timeline-buffer" id="timeline-buffer"></div>
                    <div class="timeline-progress" id="timeline-progress"></div>
                </div>
                <div class="timeline-thumb" id="timeline-thumb"></div>
            </div>

            <!-- Linha de Botões de Controle e Telemetria -->
            <div class="controls-row">
                <!-- Lado Esquerdo: Play/Pause, -10s, +10s, Volume, Tempo -->
                <div class="controls-left">
                    <button type="button" class="ctrl-btn play-circle" id="btn-play-pause" onclick="togglePlay()" title="Reproduzir / Pausar (Espaço)">
                        <svg viewBox="0 0 24 24" id="icon-play"><polygon points="6 4 20 12 6 20 6 4"/></svg>
                        <svg viewBox="0 0 24 24" id="icon-pause" style="display: none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>

                    <!-- Pular -10s -->
                    <button type="button" class="ctrl-btn" onclick="seekRelative(-10)" title="Voltar 10s (←)">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                            <text x="12" y="14.5" font-size="7" font-weight="900" text-anchor="middle" fill="currentColor">10</text>
                        </svg>
                    </button>

                    <!-- Pular +10s -->
                    <button type="button" class="ctrl-btn" onclick="seekRelative(10)" title="Avançar 10s (→)">
                        <svg viewBox="0 0 24 24">

                <!-- Lado Direito: Seletores (Qualidade, Áudio, Legenda) e Tela Cheia -->

                        <button type="button" class="ctrl-btn" id="btn-audio" onclick="toggleDropdown('card-audio')" title="Faixas de Áudio">
                            <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>

                    <!-- Menu de Legendas -->
                    <div class="popover-menu">
                        <button type="button" class="ctrl-btn" id="btn-sub" onclick="toggleDropdown('card-sub')" title="Legendas (C)">
                            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" ry="2"/><path d="M7 15h3"/><path d="M14 15h3"/><path d="M7 11h10"/></svg>

                        <div class="popover-card mono" id="card-sub"></div>

                    <!-- Tela Cheia -->
                    <button type="button" class="ctrl-btn" id="btn-fullscreen" onclick="toggleFullscreen()" title="Tela Cheia (F)">
                        <svg viewBox="0 0 24 24" id="icon-fs-enter"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                        <svg viewBox="0 0 24 24" id="icon-fs-exit" style="display: none;"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
                    </button>

            </div>
        </footer>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const state = {
            workId: params.get('workId') || '',
            epId: params.get('epId') || '',
            episode: parseInt(params.get('ep') || '1', 10) || 1,
            season: parseInt(params.get('season') || '1', 10) || 1,
            totalEpisodes: parseInt(params.get('totalEpisodes') || '0', 10) || 0,
            malId: parseInt(params.get('malId') || '0', 10) || 0,
            format: params.get('format') || 'TV',
            initialResumeTime: Math.floor(parseFloat(params.get('resume') || '0')) || 0,
            hasResumed: false,
            title: params.get('title') || 'Anime',
            titleEnglish: params.get('titleEnglish') || '',
            titleRomaji: params.get('titleRomaji') || '',
            titleNative: params.get('titleNative') || '',
            token: params.get('token') || '',
            playerSessionId: params.get('playerSessionId') || '',
            deviceId: params.get('deviceId') || '',
            playbackTicket: '',
            sourcesCount: 0,
            manifest: null,
            selectedQuality: '',
            selectedAudio: '',
            selectedSubtitleTrackId: '',
            loadedSubtitleKey: '',
            subtitleTracks: [],
            parsedSubtitleCues: [],
            requestedQuality: '',
            currentStreamUrl: '',
            hls: null,
            manifestTimer: null,
            windowController: null,
            isSeeking: false,
            idleTimer: null,
            isCustomMedia: false,
            episodeOffset: 0,
            renewTimer: null,
            currentWindow: null
        };

        const savedSubSettings = JSON.parse(localStorage.getItem('anirium_sub_settings') || '{}');
        const subConfig = {
            fontSize: parseInt(savedSubSettings.fontSize, 10) || 19, // Tamanho em px ajustável finamente (+ / -)
            color: savedSubSettings.color || '#FFFFFF',
            borderStyle: savedSubSettings.borderStyle || 'outline', // 'none', 'outline', 'glow'
            borderColor: savedSubSettings.borderColor || '#000000',
            bgStyle: savedSubSettings.bgStyle || 'none', // 'none', 'semi', 'box', 'bar'
            bgColor: savedSubSettings.bgColor || '#000000'
        };

        function saveSubConfig() {
            localStorage.setItem('anirium_sub_settings', JSON.stringify(subConfig));
            applySubStyles();
        }

        function applySubStyles() {
            if (!dom.subtitleText) return;
            const size = Math.max(12, Math.min(42, subConfig.fontSize));
            dom.subtitleText.style.fontSize = `${size}px`;
            dom.subtitleText.style.color = subConfig.color;

            // Borda / Sombra de Contorno
            const bCol = subConfig.borderColor || '#000000';
            if (subConfig.borderStyle === 'outline') {
                dom.subtitleText.style.textShadow = `2px 2px 0px ${bCol}, -2px -2px 0px ${bCol}, 2px -2px 0px ${bCol}, -2px 2px 0px ${bCol}, 0px 2px 0px ${bCol}, 0px -2px 0px ${bCol}, 2px 0px 0px ${bCol}, -2px 0px 0px ${bCol}, 0 3px 6px rgba(0,0,0,0.8)`;
            } else if (subConfig.borderStyle === 'glow') {
                dom.subtitleText.style.textShadow = `0 0 8px ${bCol}, 0 0 12px ${bCol}, 0 2px 4px rgba(0,0,0,0.9)`;
            } else {
                dom.subtitleText.style.textShadow = 'none';
            }

            // Fundo
            const baseBg = subConfig.bgColor || '#000000';
            let finalBg = 'transparent';
            let backdrop = 'none';
            let pad = '2px 8px';
            let rad = '6px';
            let borderLine = 'none';

            if (subConfig.bgStyle === 'semi') {
                finalBg = hexToRgba(baseBg, 0.55);
                backdrop = 'blur(6px)';
                pad = '4px 14px';
                borderLine = '1px solid rgba(255, 255, 255, 0.12)';
            } else if (subConfig.bgStyle === 'box') {
                finalBg = hexToRgba(baseBg, 0.92);
                backdrop = 'none';
                pad = '5px 16px';
                borderLine = `1px solid ${hexToRgba(bCol, 0.4)}`;
            } else if (subConfig.bgStyle === 'bar') {
                finalBg = hexToRgba(baseBg, 0.85);
                backdrop = 'none';
                pad = '6px 22px';
                rad = '0px';
                borderLine = 'none';
            }

            dom.subtitleText.style.background = finalBg;
            dom.subtitleText.style.backdropFilter = backdrop;
            dom.subtitleText.style.webkitBackdropFilter = backdrop;
            dom.subtitleText.style.padding = pad;
            dom.subtitleText.style.borderRadius = rad;
            dom.subtitleText.style.border = borderLine;
        }

        function hexToRgba(hex, alpha = 1) {
            if (!hex || hex === 'transparent') return 'transparent';
            if (hex.startsWith('rgba') || hex.startsWith('rgb')) return hex;
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            if (isNaN(num)) return hex;
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function adjustSubFontSize(delta) {
            subConfig.fontSize = Math.max(12, Math.min(42, (subConfig.fontSize || 19) + delta));
            saveSubConfig();
            renderSubMenu();
        }

        function setSubColor(col) {
            subConfig.color = col;
            saveSubConfig();
            renderSubMenu();
        }

        function setSubBorderStyle(st) {
            subConfig.borderStyle = st;
            saveSubConfig();
            renderSubMenu();
        }

        function setSubBorderColor(col) {
            subConfig.borderColor = col;
            saveSubConfig();
            renderSubMenu();
        }

        function setSubBgStyle(st) {
            subConfig.bgStyle = st;
            saveSubConfig();
            renderSubMenu();
        }

        function setSubBgColor(col) {
            subConfig.bgColor = col;
            saveSubConfig();
            renderSubMenu();
        }
        function episodeTimeFromProgramDate(date) {
            if (!date) return null;
            const pos = (date.getTime() - episodeEpoch) / 1000;
            return Number.isFinite(pos) && pos >= 0 && pos <= 86400 ? pos : null;
        }

        function getEpisodeTime() {
            if (state.isCustomMedia || !dom.video) return dom.video ? dom.video.currentTime || 0 : 0;
            if (state.manifest?.continuousBuffer && state.hls?.playingDate) {
                const programTime = episodeTimeFromProgramDate(state.hls.playingDate);
                if (programTime !== null) {
                    state.episodeOffset = programTime - dom.video.currentTime;
                    return programTime;
                }
            }
            if (state.currentWindow && Number.isFinite(state.currentWindow.start)) {
                return (dom.video.currentTime || 0) + state.currentWindow.start;
            }
            return Math.max(0, (dom.video.currentTime || 0) + (state.episodeOffset || 0));
        }

        const dom = {
            wrapper: document.getElementById('player-wrapper'),
            video: document.getElementById('video-element'),
            centralOverlay: document.getElementById('central-overlay'),
            overlayHeading: document.getElementById('overlay-heading'),
            overlayStatus: document.getElementById('overlay-status'),
            overlayManualActions: document.getElementById('overlay-manual-actions'),
            badgeEp: document.getElementById('badge-ep'),
            badgeStatus: document.getElementById('badge-status'),
            videoTitle: document.getElementById('video-title'),
            btnPrevEp: document.getElementById('btn-prev-ep'),
            btnNextEp: document.getElementById('btn-next-ep'),
            subtitleOverlay: document.getElementById('subtitle-overlay'),
            subtitleText: document.getElementById('subtitle-text'),
            timelineBox: document.getElementById('timeline-box'),
            timelineProgress: document.getElementById('timeline-progress'),
            timelineBuffer: document.getElementById('timeline-buffer'),
            timelineThumb: document.getElementById('timeline-thumb'),
            timeCurrent: document.getElementById('time-current'),
            timeTotal: document.getElementById('time-total'),
            iconPlay: document.getElementById('icon-play'),
            iconPause: document.getElementById('icon-pause'),
            iconVolHigh: document.getElementById('icon-vol-high'),
            iconVolMute: document.getElementById('icon-vol-mute'),
            volumeSlider: document.getElementById('volume-slider'),
            teleLinks: document.getElementById('tele-links'),
            telePeers: document.getElementById('tele-peers'),
            teleRate: document.getElementById('tele-rate'),
            btnQuality: document.getElementById('btn-quality'),
            cardQuality: document.getElementById('card-quality'),
            cardAudio: document.getElementById('card-audio'),
            cardSub: document.getElementById('card-sub'),
            iconFsEnter: document.getElementById('icon-fs-enter'),
            iconFsExit: document.getElementById('icon-fs-exit'),
            feedbackLeft: document.getElementById('feedback-left'),
            feedbackCenter: document.getElementById('feedback-center'),
            feedbackCenterIcon: document.getElementById('feedback-center-icon'),
            feedbackRight: document.getElementById('feedback-right')
        };

        function showActionFeedback(target, text = '') {
            const el = target === 'left' ? dom.feedbackLeft : (target === 'right' ? dom.feedbackRight : dom.feedbackCenter);
            if (!el) return;
            if (target === 'center' && text && dom.feedbackCenterIcon) {
                dom.feedbackCenterIcon.innerText = text;
            }
            el.classList.add('show');
            setTimeout(() => {
                el.classList.remove('show');
            }, 550);
        }

        function formatTime(sec) {
            if (!Number.isFinite(sec) || sec < 0) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function langLabel(code) {
            const map = {
                jpn: 'Japonês (Original)',
                por: 'Português (BR)',
                'pt-br': 'Português (BR)',
                eng: 'Inglês',
                spa: 'Espanhol',
                und: 'Original'
            };
            return map[String(code || '').toLowerCase()] || String(code || '').toUpperCase();
        }

        // ==========================================
        //  CONTROLE DE ATIVIDADE E AUTO-HIDE
        // ==========================================
        function resetIdleTimer() {
            dom.wrapper.classList.remove('hide-controls');
            dom.wrapper.classList.remove('hide-cursor');
            if (state.idleTimer) clearTimeout(state.idleTimer);
            if (!dom.video.paused) {
                state.idleTimer = setTimeout(() => {
                    // Não esconde se houver menu aberto
                    if (document.querySelector('.popover-card.open')) return;
                    dom.wrapper.classList.add('hide-controls');
                    dom.wrapper.classList.add('hide-cursor');
                }, 3200);
            }
        }

        dom.wrapper.addEventListener('mousemove', resetIdleTimer);
        // Click & Double Click no corpo do Player (Play/Pause no centro, +-10s nas bordas)
        let clickTimeout = null;
        dom.wrapper.addEventListener('click', (e) => {
            // Fecha popovers se clicou fora deles
            if (!e.target.closest('.popover-menu')) {
                closeAllPopovers();
            }
            resetIdleTimer();

            // Ignora cliques que atingiram barras de controles, cabeçalho, modais, popovers ou botões
            if (e.target.closest('.player-controls, .player-header, .popover-card, #central-overlay, button, input')) {
                return;
            }

            const rect = dom.wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const width = rect.width;
            const xPercent = x / width;

            if (clickTimeout) {
                clearTimeout(clickTimeout);
                clickTimeout = null;
                // Double click detectado!
                if (xPercent < 0.35) {
                    seekRelative(-10);
                    showActionFeedback('left', '❮❮ 10s');
                } else if (xPercent > 0.65) {
                    seekRelative(10);
                    showActionFeedback('right', '10s ❯❯');
                } else {
                    toggleFullscreen();
                }
            } else {
                clickTimeout = setTimeout(() => {
                    clickTimeout = null;
                    if (xPercent < 0.22) {
                        // Clique rápido na ponta esquerda
                        seekRelative(-10);
                        showActionFeedback('left', '❮❮ 10s');
                    } else if (xPercent > 0.78) {
                        // Clique rápido na ponta direita
                        seekRelative(10);
                        showActionFeedback('right', '10s ❯❯');
                    } else {
                        // Clique no centro ou corpo principal do vídeo: Alterna Play/Pause
                        togglePlay();
                        showActionFeedback('center', dom.video.paused ? '❚❚' : '▶');
                    }
                }, 220);
            }
        });

        function closeAllPopovers() {
            document.querySelectorAll('.popover-card').forEach(c => c.classList.remove('open'));
        }

        function toggleDropdown(cardId) {
            const card = document.getElementById(cardId);
            if (!card) return;
            const isOpen = card.classList.contains('open');
            closeAllPopovers();
            if (!isOpen) card.classList.add('open');
        }
        window.toggleDropdown = toggleDropdown;

        // ==========================================
        //  REPRODUÇÃO, SEEK E VOLUME
        // ==========================================
        function togglePlay() {
            if (dom.video.paused) {
                dom.video.play().catch(() => {});
            } else {
                dom.video.pause();
            }
        }

        dom.video.addEventListener('play', () => {
            dom.iconPlay.style.display = 'none';
            dom.iconPause.style.display = 'block';
            resetIdleTimer();
        });

        dom.video.addEventListener('pause', () => {
            dom.iconPlay.style.display = 'block';
            dom.iconPause.style.display = 'none';
            resetIdleTimer();
        });

        function seekRelative(deltaSeconds) {
            const current = dom.video.currentTime || 0;
            const dur = dom.video.duration || 0;
            const target = Math.max(0, Math.min(dur ? dur - 0.5 : 99999, current + deltaSeconds));
            seekTo(target);
        }

        function seekTo(targetSeconds) {
            if (state.isCustomMedia || !state.manifest?.windowOnDemand) {
                dom.video.currentTime = targetSeconds;
                return;
            }

            // Seek sob demanda no Anirium Service
            if (state.windowController) {
                try { state.windowController.abort(); } catch (e) {}
            }
            const ctrl = new AbortController();
            state.windowController = ctrl;

            fetch(`http://127.0.0.1:4004/playback/session?playbackTicket=${encodeURIComponent(state.playbackTicket)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: ctrl.signal,
                body: JSON.stringify({
                    action: 'seek',
                    quality: state.selectedQuality,
                    position: Math.floor(targetSeconds),
                    playing: !dom.video.paused,
                    audio: state.selectedAudio || '',
                    subtitle: state.selectedSubtitleTrackId && state.selectedSubtitleTrackId !== 'off' ? state.selectedSubtitleTrackId : ''
                })
            }).then(r => r.json()).then(data => {
                if (data.window && data.window.status === 'ready' && data.window.playlistUrl) {
                    state.currentWindow = data.window;
                    const streamUrl = `http://127.0.0.1:4004${data.window.playlistUrl}?playbackTicket=${encodeURIComponent(state.playbackTicket)}`;
                    playStream(streamUrl, `Anirium+ (${state.selectedQuality})`);
                }
            }).catch(() => {});
        }

        // Timeline Scrubber
        dom.timelineBox.addEventListener('click', (e) => {
            const rect = dom.timelineBox.getBoundingClientRect();
            const clickPos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const dur = dom.video.duration || 0;
            if (dur > 0) {
                seekTo(clickPos * dur);
            }
        });

        let lastReportedProgressSec = -1;
        let lastReportedProgressTime = 0;

        function reportPlaybackProgress(force = false) {
            const ct = getEpisodeTime();
            if (!Number.isFinite(ct) || ct < 0) return;
            const now = Date.now();
            const currentFloorSec = Math.floor(ct);

            // Throttle: no máximo a cada 5 segundos ou se forçado (pause, seek, beforeunload)
            if (!force && (now - lastReportedProgressTime < 5000 || currentFloorSec === lastReportedProgressSec)) {
                return;
            }

            lastReportedProgressTime = now;
            lastReportedProgressSec = currentFloorSec;

            window.parent.postMessage({
                type: 'anirium:player:playback-progress',
                workId: state.workId,
                epId: state.epId,
                episode: state.episode,
                currentTime: currentFloorSec,
                duration: Math.floor(state.manifest?.episodeDuration || dom.video.duration || 0)
            }, '*');
        }

        dom.video.addEventListener('loadedmetadata', () => {
            if (!state.hasResumed && state.initialResumeTime > 2) {
                state.hasResumed = true;
                console.info('[PlayerPro] Retomando reprodução no instante exato salvo:', state.initialResumeTime, 's');
                seekTo(state.initialResumeTime);
            }
        });

        dom.video.addEventListener('timeupdate', () => {
            const ct = getEpisodeTime();
            const dur = (state.manifest?.episodeDuration && state.manifest.episodeDuration > 0)
                ? state.manifest.episodeDuration
                : (dom.video.duration || 0);

            // Se ainda não aplicou o tempo de retomada e o player já começou a rodar
            if (!state.hasResumed && state.initialResumeTime > 2) {
                state.hasResumed = true;
                const durVal = (state.manifest?.episodeDuration && state.manifest.episodeDuration > 0)
                    ? state.manifest.episodeDuration
                    : (dom.video.duration || 0);
                if (durVal > 0 && state.initialResumeTime < durVal - 10) {
                    console.info('[PlayerPro] Aplicando retomada exata na inicialização do stream:', state.initialResumeTime, 's');
                    seekTo(state.initialResumeTime);
                }
            }

            dom.timeCurrent.innerText = formatTime(ct);
            dom.timeTotal.innerText = formatTime(dur);

            if (dur > 0) {
                const pct = Math.min(100, (ct / dur) * 100);
                dom.timelineProgress.style.width = `${pct}%`;
                dom.timelineThumb.style.left = `${pct}%`;

                // Buffer do navegador
                if (dom.video.buffered && dom.video.buffered.length > 0) {
                    for (let i = 0; i < dom.video.buffered.length; i++) {
                        if (dom.video.currentTime >= dom.video.buffered.start(i) && dom.video.currentTime <= dom.video.buffered.end(i)) {
                            const bufPct = Math.min(100, ((dom.video.buffered.end(i) + (state.episodeOffset || 0)) / dur) * 100);
                            dom.timelineBuffer.style.width = `${bufPct}%`;
                            break;
                        }
                    }
                }
            }

            // Atualiza exibição de legendas usando o relógio real do episódio
            updateSubtitleCue(ct);

            // Notifica Core com a posição exata para persistência contínua
            reportPlaybackProgress(false);
        });

        window.addEventListener('beforeunload', () => {
            reportPlaybackProgress(true);
        });

        // Volume
        function toggleMute() {
            dom.video.muted = !dom.video.muted;
            updateVolumeUI();
        }

        dom.volumeSlider.addEventListener('input', (e) => {
            dom.video.volume = parseFloat(e.target.value);
            dom.video.muted = false;
            updateVolumeUI();
        });

        function updateVolumeUI() {
            const isMuted = dom.video.muted || dom.video.volume === 0;
            dom.iconVolHigh.style.display = isMuted ? 'none' : 'block';
            dom.iconVolMute.style.display = isMuted ? 'block' : 'none';
            dom.volumeSlider.value = isMuted ? 0 : dom.video.volume;
        }

        // Fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                dom.wrapper.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const isFs = Boolean(document.fullscreenElement);
            dom.iconFsEnter.style.display = isFs ? 'none' : 'block';
            dom.iconFsExit.style.display = isFs ? 'block' : 'none';
        });

        // ==========================================
        //  PARSER DE LEGENDAS WEBVTT & OVERLAY
        // ==========================================
        function parseVtt(text) {
            const cues = [];
            const parseTimestamp = (t) => {
                const parts = t.trim().split(':');
                if (parts.length === 3) {
                    const h = parseFloat(parts[0]);
                    const m = parseFloat(parts[1]);
                    const s = parseFloat(parts[2].replace(',', '.'));
                    return h * 3600 + m * 60 + s;
                } else if (parts.length === 2) {
                    const m = parseFloat(parts[0]);
                    const s = parseFloat(parts[1].replace(',', '.'));
                    return m * 60 + s;
                }
                return 0;
            };

            const blocks = text.replace(/\r\n|\r/g, '\n').split(/\n\s*\n/);
            for (const block of blocks) {
                const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('-->')) {
                        const timeParts = lines[i].split('-->');
                        if (timeParts.length >= 2) {
                            const startStr = timeParts[0].trim();
                            const rawEndWithSettings = timeParts[1].trim();
                            const endTokens = rawEndWithSettings.split(/\s+/);
                            const endStr = endTokens[0];
                            const start = parseTimestamp(startStr);
                            const end = parseTimestamp(endStr);

                            // Detecta posicionamento de alinhamento embutido (ex: line:10%, line:0, position:20%, align:start)
                            let lineSetting = null;
                            let alignSetting = 'center';
                            for (let sIdx = 1; sIdx < endTokens.length; sIdx++) {
                                const token = endTokens[sIdx];
                                if (token.startsWith('line:')) {
                                    lineSetting = token.replace('line:', '');
                                } else if (token.startsWith('align:')) {
                                    alignSetting = token.replace('align:', '');
                                }
                            }

                            const cueLines = lines.slice(i + 1).filter(l => !l.startsWith('NOTE') && !l.startsWith('STYLE') && !l.startsWith('REGION'));
                            const cleanText = cueLines
                                .join('\n')
                                .replace(/<[^>]+>/g, '')
                                .replace(/\{[^}]+\}/g, '')
                                .trim();
                            if (cleanText && end > start) {
                                cues.push({ start, end, text: cleanText, line: lineSetting, align: alignSetting });
                            }
                        }
                        break;
                    }
                }
            }
            return cues;
        }

        let subtitleAbortController = null;
        let isFetchingSubtitle = false;

        async function fetchSubtitleTrack(trackId, force = false) {
            if (!trackId || trackId === 'off') {
                state.selectedSubtitleTrackId = 'off';
                state.loadedSubtitleKey = '';
                state.parsedSubtitleCues = [];
                isFetchingSubtitle = false;
                if (subtitleAbortController) {
                    try { subtitleAbortController.abort(); } catch (e) {}
                    subtitleAbortController = null;
                }
                dom.subtitleOverlay.style.display = 'none';
                dom.subtitleText.innerText = '';
                renderSubMenu();
                return;
            }

            // Normaliza/extrai idioma pretendido da faixa
            const targetTrack = state.manifest && Array.isArray(state.manifest.subtitleTracks)
                ? (state.manifest.subtitleTracks.find(t => t.id === trackId) || state.manifest.subtitleTracks[0])
                : null;
            const targetLang = targetTrack?.language || (trackId.includes('por') || trackId.includes('pt') ? 'por' : 'und');

            // Se já tem legendas carregadas com sucesso e não foi uma ação forçada do usuário (force === false), não re-faz fetch
            if (!force && state.parsedSubtitleCues.length > 0 && state.loadedSubtitleKey) {
                return;
            }

            // Se uma busca já está em andamento (ex: loop 202 do ffmpeg) e não é uma troca manual do usuário, não interrompe!
            if (!force && isFetchingSubtitle) {
                return;
            }

            state.selectedSubtitleTrackId = trackId;
            renderSubMenu();

            if (!state.playbackTicket) return;

            // Cancela requisições anteriores de legenda SOMENTE quando o usuário explicitamente trocou
            if (subtitleAbortController) {
                try { subtitleAbortController.abort(); } catch (e) {}
            }
            subtitleAbortController = new AbortController();
            const signal = subtitleAbortController.signal;
            isFetchingSubtitle = true;

            // Resolve o ID atual da faixa diretamente do manifesto ativo
            let resolvedTrackId = trackId;
            if (state.manifest && Array.isArray(state.manifest.subtitleTracks)) {
                const exact = state.manifest.subtitleTracks.find(t => t.id === trackId);
                if (!exact) {
                    // Tenta encontrar por idioma equivalente (ex: pt, por, eng)
                    const langMatch = state.manifest.subtitleTracks.find(t => (t.language && (t.language === targetLang || targetLang.includes(t.language))) || (t.id && t.id.includes(targetLang)));
                    const fallback = langMatch || state.manifest.subtitleTracks[0];
                    if (fallback) {
                        resolvedTrackId = fallback.id;
                        state.selectedSubtitleTrackId = resolvedTrackId;
                    }
                }
            }

            const currentKey = `${state.playbackTicket}:${resolvedTrackId}`;
            console.info('[PlayerPro] Solicitando faixa de legenda:', resolvedTrackId, 'Idioma:', targetLang);
            const url = `http://127.0.0.1:4004/subtitles?trackId=${encodeURIComponent(resolvedTrackId)}&playbackTicket=${encodeURIComponent(state.playbackTicket)}`;
            
            // Loop de Retry para 202 Accepted (anirium-service extraindo faixa)
            try {
                for (let attempt = 0; attempt < 30; attempt++) {
                    if (signal.aborted) {
                        isFetchingSubtitle = false;
                        return;
                    }
                    try {
                        const res = await fetch(url, { signal });
                        if (res.status === 202) {
                            const delayHeader = parseInt(res.headers.get('Retry-After') || '2', 10);
                            const waitSec = Number.isFinite(delayHeader) && delayHeader >= 1 && delayHeader <= 10 ? delayHeader : 2;
                            await new Promise((resolve, reject) => {
                                const timer = setTimeout(resolve, waitSec * 1000);
                                signal.addEventListener('abort', () => { clearTimeout(timer); reject(); }, { once: true });
                            });
                            continue;
                        }
                        if (res.status === 404) {
                            console.warn('[PlayerPro] Faixa de legenda não encontrada (404):', resolvedTrackId);
                            // Se falhou 404 com trackId específico, tenta outra faixa disponível se houver
                            if (state.manifest && Array.isArray(state.manifest.subtitleTracks)) {
                                const alt = state.manifest.subtitleTracks.find(t => t.id !== resolvedTrackId);
                                if (alt && attempt === 0) {
                                    resolvedTrackId = alt.id;
                                    state.selectedSubtitleTrackId = alt.id;
                                    continue;
                                }
                            }
                            break;
                        }
                        if (res.ok) {
                            const vttContent = await res.text();
                            if (!signal.aborted) {
                                const cues = parseVtt(vttContent);
                                state.parsedSubtitleCues = cues;
                                state.loadedSubtitleKey = currentKey;
                                console.info(`[PlayerPro] Legenda carregada com sucesso (${cues.length} falas sincronizadas)`);
                                updateSubtitleCue(getEpisodeTime());
                            }
                            break;
                        }
                    } catch (e) {
                        if (signal.aborted) break;
                    }
                }
            } finally {
                isFetchingSubtitle = false;
            }
        }

        let lastLoggedCueTime = -1;
        function updateSubtitleCue(currentTime) {
            if (!state.selectedSubtitleTrackId || state.selectedSubtitleTrackId === 'off' || state.parsedSubtitleCues.length === 0) {
                dom.subtitleOverlay.style.display = 'none';
                return;
            }

            const activeCues = state.parsedSubtitleCues.filter(c => currentTime >= c.start && currentTime <= c.end);
            if (activeCues.length > 0) {
                const text = activeCues.map(c => c.text).join('\n');
                if (dom.subtitleText.innerText !== text) {
                    dom.subtitleText.innerText = text;
                }

                // Posicionamento inteligente baseado em tags WebVTT embutidas no cue
                const topCue = activeCues[0];
                if (topCue && topCue.line !== null) {
                    const lineVal = parseFloat(topCue.line);
                    if (!isNaN(lineVal)) {
                        if (lineVal <= 20 || topCue.line.startsWith('0') || topCue.line.startsWith('10%') || topCue.line.startsWith('15%')) {
                            // Legenda de topo (ex: títulos/aberturas ou falas no topo)
                            dom.subtitleOverlay.style.bottom = 'auto';
                            dom.subtitleOverlay.style.top = `${Math.max(40, lineVal)}px`;
                        } else {
                            dom.subtitleOverlay.style.top = 'auto';
                            dom.subtitleOverlay.style.bottom = `${Math.max(40, lineVal)}px`;
                        }
                    }
                } else {
                    dom.subtitleOverlay.style.top = 'auto';
                    dom.subtitleOverlay.style.bottom = dom.wrapper.classList.contains('hide-controls') ? '30px' : '84px';
                }

                // Alinhamento do texto
                if (topCue && topCue.align) {
                    dom.subtitleText.style.textAlign = topCue.align === 'start' || topCue.align === 'left' ? 'left' : (topCue.align === 'end' || topCue.align === 'right' ? 'right' : 'center');
                } else {
                    dom.subtitleText.style.textAlign = 'center';
                }

                dom.subtitleOverlay.style.display = 'flex';
                if (Math.floor(currentTime) !== lastLoggedCueTime) {
                    lastLoggedCueTime = Math.floor(currentTime);
                    console.info('[PlayerPro] Exibindo fala:', text.replace(/\n/g, ' '));
                }
            } else {
                dom.subtitleOverlay.style.display = 'none';
            }
        }

        // ==========================================

        // ==========================================
        function renderQualityMenu() {
            const m = state.manifest || {};
            const rawQualities = Array.isArray(m.qualities) ? m.qualities : [];
            const qualityOrder = ['1080p', '720p', '480p', '360p'];
            const qualities = [...rawQualities].sort((a, b) => {
                const idxA = qualityOrder.indexOf(a);
                const idxB = qualityOrder.indexOf(b);
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                if (idxA !== -1) return -1;
                if (idxB !== -1) return 1;
                return a.localeCompare(b);
            });

            dom.btnQuality.innerText = state.selectedQuality || 'HD';

            dom.cardQuality.innerHTML = `
                <div class="popover-header">
                    <span>QUALIDADE DE VÍDEO</span>
                    <span style="font-size: 9px; opacity: 0.7;">${qualities.length} opções</span>
                </div>
                <div class="popover-scroll-area">
                    ${qualities.map(q => `
                        <button type="button" class="popover-item ${state.selectedQuality === q ? 'active' : ''}" onclick="selectQuality('${q}')">
                            <span>${q}</span>
                            ${state.selectedQuality === q ? '<span>✓</span>' : ''}
                        </button>
                    `).join('')}
                </div>
            `;
        }
