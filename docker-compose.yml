services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: anirium_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - anirium_network

  web:
    image: nginx:alpine
    container_name: anirium_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - anirium_network

networks:
  anirium_network:
    driver: bridge
